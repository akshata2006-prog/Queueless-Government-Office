<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Check Token | QueueLess</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-dark bg-primary">

        <div class="container">

            <a class="navbar-brand fw-bold" href="index.html">
                QueueLess
            </a>

            <a href="index.html" class="btn btn-light">
                Home
            </a>

        </div>

    </nav>


    <!-- Main Section -->
    <main class="container py-5">

        <div class="text-center mb-4">

            <h1 class="fw-bold">Check Token Status</h1>

            <p class="text-muted">
                Enter your token number to check your queue status.
            </p>

        </div>


        <!-- Token Search Form -->
        <div class="form-card">

            <form id="checkTokenForm">

                <div class="mb-4">

                    <label for="tokenNumber" class="form-label fw-bold">
                        Enter Token Number
                    </label>

                    <input
                        type="text"
                        id="tokenNumber"
                        class="form-control"
                        placeholder="Example: BC-101"
                        maxlength="20"
                        required>

                </div>


                <button
                    type="submit"
                    class="btn btn-primary w-100">

                    Check Status

                </button>

            </form>


            <!-- Result Area -->
            <div id="tokenResult"
                 class="mt-4"
                 aria-live="polite">
            </div>

        </div>

    </main>


    <!-- Footer -->
    <footer class="text-center py-4">

        <p class="mb-0">
            QueueLess Government Office | Hackathon Project
        </p>

    </footer>


    <!-- JavaScript -->
    <script src="js/script.js"></script>

</body>

</html>
