<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Select Government Service</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-dark bg-primary">

        <div class="container">

            <a class="navbar-brand fw-bold" href="index.html">
                QueueLess
            </a>

            <a href="index.html" class="btn btn-light">
                Home
            </a>

        </div>

    </nav>


    <!-- Page Heading -->
    <section class="container text-center py-5">

        <h1 class="fw-bold">Select Your Government Service</h1>

        <p class="text-muted">
            Choose your office and the service you need.
        </p>

    </section>


    <!-- Service Selection Form -->
    <section class="container">

        <div class="form-card">

            <form id="serviceForm">

                <!-- Government Office -->
                <div class="mb-4">

                    <label for="office" class="form-label fw-bold">
                        1. Select Government Office
                    </label>

                    <select id="office" class="form-select" required>

                        <option value="">-- Choose Office --</option>

                        <option value="municipal">
                            Municipal Corporation
                        </option>

                        <option value="collector">
                            Collector Office
                        </option>

                        <option value="mamlatdar">
                            Mamlatdar Office
                        </option>

                    </select>

                </div>


                <!-- Government Service -->
                <div class="mb-4">

                    <label for="service" class="form-label fw-bold">
                        2. Select Required Service
                    </label>

                    <select id="service" class="form-select" required>

                        <option value="">-- Choose Service --</option>

                        <option value="birth">
                            Birth Certificate
                        </option>

                        <option value="income">
                            Income Certificate
                        </option>

                        <option value="caste">
                            Caste Certificate
                        </option>

                        <option value="residence">
                            Residence Certificate
                        </option>

                    </select>

                </div>


                <!-- Continue Button -->
                <button type="submit" class="btn btn-primary w-100">
                    Continue →
                </button>

            </form>

        </div>

    </section>


    <!-- Footer -->
    <footer class="text-center py-4 mt-5">

        <p class="mb-0">
            QueueLess Government Office | Hackathon Project
        </p>

    </footer>


    <!-- JavaScript -->
    <script src="js/script.js"></script>

</body>

</html>
